version: '3.8'

services:
  memorysync-starter:
    # Dockerfile.dev, not the root Dockerfile: these services need bash, curl
    # and jq for tools/inspect_memory.sh. The root Dockerfile is the minimal
    # deployable server image and deliberately has none of that.
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: memorysync-cursor-starter
    volumes:
      - .:/workspace
    environment:
      - MEMORYSYNC_API_KEY=${MEMORYSYNC_API_KEY:-}
      - MEMORYSYNC_MCP_URL=https://mcp.memorysync.io/mcp
      - MEMORYSYNC_DOCS_MCP_URL=https://docs.memorysync.io/mcp
    command: ["./tools/inspect_memory.sh", "ping"]

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
    environment:
      - MEMORYSYNC_API_KEY=${MEMORYSYNC_API_KEY:-}
      - MEMORYSYNC_MCP_URL=https://mcp.memorysync.io/mcp
      - MEMORYSYNC_DOCS_MCP_URL=https://docs.memorysync.io/mcp
    command: ["python3", "examples/minimal_mcp_client.py"]
